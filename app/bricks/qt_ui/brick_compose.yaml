# The Qt panel, drawing straight to KMS/DRM through EGLFS: it owns the display, so the
# board must not run a desktop or Weston. Reads the booth over the compose network.
services:
  qt_ui:
    image: ${QT_UI_IMAGE:-lbornia/ventuno-demo-booth-ui:latest}
    # Root for now: DRM master and /dev/input need the video and input groups, and the
    # orchestrator only grants video/render/audio/dialout to a uid 1000 service.
    user: root
    depends_on:
      - booth
    environment:
      BOOTH_URL: http://booth:8080
      QT_QPA_PLATFORM: ${QT_QPA_PLATFORM:-eglfs}
      WAYLAND_SOCKET: ${WAYLAND_SOCKET:-/run/user/1000/wayland-0}
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tmp:/tmp
      - /run/user/1000:/run/user/1000
    device_cgroup_rules:
      - "c 226:* rmw"    # dri: KMS display + GPU render node
      - "c 13:* rmw"     # input: touch, mouse, keyboard
      - "c 4:* rmw"      # tty
